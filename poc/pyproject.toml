[project]
name = "baby-motion-poc"
version = "0.1.0"
description = "Proof of concept for baby motion video analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "matplotlib",
    "mediapipe>=1.0.1",
    "numpy",
    "opencv-python",
    "pandas",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
